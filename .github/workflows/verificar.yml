name: Verificar taller FoodExpress

on:
  push:
    branches: [main]

jobs:
  verificar:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Correr el productor y validar los JSON
        run: |
          php eventos_foodexpress/productor.php
          php -r '
          $total = 0;
          foreach (["pedidos", "cancelaciones", "consultas_estado"] as $archivo) {
              $ruta = "eventos_foodexpress/data/" . $archivo . ".json";
              $datos = json_decode(file_get_contents($ruta), true);
              if (!is_array($datos)) {
                  fwrite(STDERR, "JSON invalido: " . $ruta . PHP_EOL);
                  exit(1);
              }
              $total += count($datos);
          }
          if ($total !== 5) {
              fwrite(STDERR, "Se esperaban 5 registros y se obtuvieron " . $total . PHP_EOL);
              exit(1);
          }
          echo "OK: 5 registros en los tres archivos" . PHP_EOL;
          '

      - name: Verificar la consola web
        run: |
          php -S 127.0.0.1:8099 -t . > /dev/null 2>&1 &
          sleep 3
          if [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/index.php)" != "200" ]; then
              echo "La consola web no responde" >&2
              exit 1
          fi
          cuerpo=$(curl -s -X POST -H "Content-Type: application/json" -d '{"escenario":"nuevo_pedido"}' "http://127.0.0.1:8099/api.php?accion=emitir")
          echo "$cuerpo" | grep -q "inicio_preparacion" || { echo "No llego a cocina" >&2; exit 1; }
          echo "$cuerpo" | grep -q "asignar_repartidor" || { echo "No llego a logistica" >&2; exit 1; }
          echo "OK: la consola enruta hacia cocina y logistica"
